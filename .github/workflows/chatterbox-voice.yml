name: Build and publish chatterbox-voice

on:
  push:
    branches: ["**"]
    paths:
      - "chatterbox-voice/Dockerfile"
      - "chatterbox-voice/server.py"
      - ".github/workflows/chatterbox-voice.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk (PyTorch CUDA base is large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./chatterbox-voice
          push: true
          tags: |
            ghcr.io/jbowensii/chatterbox-voice:0.1.0
            ghcr.io/jbowensii/chatterbox-voice:latest
